<body>

      <div class="col-lg-4 contact-details">

        <div>
          <i class="fa fa-home"></i>
          <span>
            <h5>Company Address</h5>
            <p>8 Covergate road, Belfast BT1 2BG</p>
          </span>
        </div>

        <div>
          <i class="fa fa-phone"></i>
          <span>
            <h5>(+44) 77033 37175</h5>

        </div>

        <div>
          <i class="fa fa-envelope"></i>
          <span>
            <h5>bushtuckerbistro@gmail.com</h5>
            <p>Email Us/Contact Form anytime for queries.</p>
          </span>
        </div>

      </div>  
</body>

      <div class="col-lg-8 contact-col">

        <!-- Indicated required fields with * to comply with WCAG accessibility guidelines-->
        <form id="contactForm">
          <label for="name">Name *</label>
          <input type="text" id="name" placeholder="Enter your name" required>

          <label for="email">Email *</label>
          <input id="email" placeholder="Enter email address" required>

          <label for="phoneno">Phone Number</label>
          <input id="phoneno" placeholder="Enter phone number">

          <label for="subject">Subject</label>
          <input type="text" id="subject" placeholder="Enter your subject">
          
          <label for="message">Message *</label>
          <textarea rows="8" id="message" placeholder="Enter your message" required></textarea>
          
           <!-- bootstrap used here to style button -->
           <!-- used type button as dont actually need to submit form anywhere yet -->
          <button type="submit" class="btn btn-secondary" onclick="formSubmit()">Send Message</button>
        </form>

      </div>



    </div>

  </section>
